[package]
name = "jobexec"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Run a command inside a Windows Job Object so the whole process tree dies with it (process-group semantics for Windows)."
license = "MIT"
repository = "https://github.com/petrroll/jobexec"
readme = "README.md"
keywords = ["windows", "job-object", "process-tree", "kill", "process-group"]
categories = ["command-line-utilities", "os::windows-apis"]

[[bin]]
name = "jobexec"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
